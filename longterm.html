<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>STG 長週期溢價圖</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js" integrity="sha384-8J8e9bGIwf7e9BLO5rwf4zJwNRKcypGnvuGzORD/t4TrFA1gWbl3Hsi/RvyWwBKl" crossorigin="anonymous"></script>
<style>
  :root { --bg:#131722; --panel:#1e222d; --line:#2a2e39; --text:#d1d4dc; --dim:#787b86; --up:#26a69a; --down:#ef5350; --blue:#2962ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"PingFang TC","Helvetica Neue",Arial,sans-serif; font-size:13px; }
  #app { display:flex; flex-direction:column; height:100%; }
  .bar { display:flex; align-items:center; gap:14px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .grp { display:flex; gap:2px; }
  button { background:transparent; color:var(--text); border:0; padding:5px 9px; border-radius:4px; cursor:pointer; font-size:13px; }
  button:hover { background:var(--line); }
  button.on { background:var(--blue); color:#fff; }
  .sep { width:1px; height:20px; background:var(--line); }
  .cards { display:flex; gap:20px; margin-left:auto; flex-wrap:wrap; }
  .card .k { color:var(--dim); font-size:11px; }
  .card .v { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .card .s { color:var(--dim); font-size:11px; font-variant-numeric:tabular-nums; }
  .up { color:var(--up); } .down { color:var(--down); }
  #wrap { position:relative; flex:1; min-height:0; }
  #chart { position:absolute; inset:0; }
  #legend { position:absolute; left:10px; top:8px; z-index:5; font-size:12px; line-height:1.6; pointer-events:none;
    background:rgba(19,23,34,.8); padding:4px 8px; border-radius:4px; font-variant-numeric:tabular-nums; }
  .foot { display:flex; gap:18px; padding:5px 12px; background:var(--panel); border-top:1px solid var(--line); color:var(--dim); font-size:12px; flex-wrap:wrap; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#f0b90b; margin-right:5px; }
  .dot.ok { background:var(--up); } .dot.bad { background:var(--down); }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="grp" id="ivs"></div>
    <div class="sep"></div>
    <div class="grp" id="rngs"></div>
    <div class="sep"></div>
    <div class="grp"><button id="logBtn" class="on">價格對數座標</button></div>
    <div class="cards">
      <div class="card"><div class="k">最新溢價</div><div class="v" id="cNow">-</div><div class="s" id="cNowS"> </div></div>
      <div class="card"><div class="k">期間最高溢價</div><div class="v" id="cMax">-</div><div class="s" id="cMaxS"> </div></div>
      <div class="card"><div class="k">期間中位數</div><div class="v" id="cMed">-</div><div class="s" id="cMedS"> </div></div>
      <div class="card"><div class="k">資金費率（即時預估）</div><div class="v" id="cFr">-</div><div class="s" id="cFrS"> </div></div>
      <div class="card"><div class="k">STG / 合理價</div><div class="v" id="cPx">-</div><div class="s" id="cPxS"> </div></div>
    </div>
  </div>
  <div id="wrap"><div id="chart"></div><div id="legend"></div></div>
  <div class="foot">
    <span><span class="dot" id="dot"></span><span id="fLoad">載入中</span></span>
    <span>溢價 = STG / (0.08634 x ZRO) - 1，幣安現貨。K 線的開收盤用同根開收盤價算，高低點用 STG 最高最低價除以該根 ZRO 收盤價，是近似值。時間為 UTC+8，K 線切日依幣安（UTC）</span>
  </div>
</div>

<script>
const R = 0.08634;
const SHIFT = 8 * 3600;
const START = Date.UTC(2025, 7, 1);                        // 2025-08-01
const IVS = { "1h": 3600000, "4h": 14400000, "1d": 86400000, "1w": 604800000 };
const RANGES = [["1M", 30], ["3M", 91], ["6M", 182], ["全部", 0]];
const HOSTS = ["https://api.binance.com", "https://data-api.binance.vision"];
const EVENTS = [                                           // 只放已查到來源的日期（UTC+8）
  ["2025-08-11", "LayerZero 提出併購"],
  ["2025-08-24", "DAO 通過"],
  ["2026-06-12", "6/12 插針日"],
];
const $ = (id) => document.getElementById(id);
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
let iv = store("lt_iv") || "1d", rng = store("lt_rng") || "全部", logOn = store("lt_log") !== "0";
if (!IVS[iv]) iv = "1d";
if (!RANGES.some((r) => r[0] === rng)) rng = "全部";
const dbg = { bars: [], iv: "", loads: 0 };

// ---------- 圖表 ----------
const chart = LightweightCharts.createChart($("chart"), {
  autoSize: true,
  layout: { background: { color: "#131722" }, textColor: "#d1d4dc", panes: { separatorColor: "#2a2e39" } },
  grid: { vertLines: { color: "#1e222d" }, horzLines: { color: "#1e222d" } },
  timeScale: { timeVisible: true, secondsVisible: false, borderColor: "#2a2e39" },
  rightPriceScale: { borderColor: "#2a2e39" },
});
const premS = chart.addSeries(LightweightCharts.CandlestickSeries, {
  upColor: "#26a69a", downColor: "#ef5350", borderVisible: false, wickUpColor: "#26a69a", wickDownColor: "#ef5350",
  priceFormat: { type: "custom", formatter: (v) => v.toFixed(0) + "%", minMove: 0.01 },
}, 0);
premS.createPriceLine({ price: 0, color: "#787b86", lineWidth: 1, lineStyle: 2, title: "合理價" });
const pfx = { type: "price", precision: 5, minMove: 0.00001 };
const stgS = chart.addSeries(LightweightCharts.LineSeries, { color: "#8ab4f8", lineWidth: 2, title: "STG", priceFormat: pfx }, 1);
const fairS = chart.addSeries(LightweightCharts.LineSeries, { color: "#26a69a", lineWidth: 2, lineStyle: 2, title: "合理價", priceFormat: pfx }, 1);
const volS = chart.addSeries(LightweightCharts.HistogramSeries, { title: "STG 成交額", priceFormat: { type: "custom", formatter: (v) => (v / 1e6).toFixed(2) + "M", minMove: 1 } }, 2);
const fundS = chart.addSeries(LightweightCharts.HistogramSeries, { title: "資金費率", priceFormat: { type: "custom", formatter: (v) => v.toFixed(4) + "%", minMove: 0.0001 } }, 3);
function layoutPanes() { try { const p = chart.panes(); [3, 1.4, 0.8, 1.1].forEach((x, i) => p[i] && p[i].setStretchFactor(x)); } catch (e) {} }
layoutPanes();
const markers = LightweightCharts.createSeriesMarkers ? LightweightCharts.createSeriesMarkers(premS, []) : null;
function applyLog() { try { stgS.priceScale().applyOptions({ mode: logOn ? LightweightCharts.PriceScaleMode.Logarithmic : LightweightCharts.PriceScaleMode.Normal }); } catch (e) {} $("logBtn").className = logOn ? "on" : ""; }

// ---------- 資料 ----------
async function getK(sym, interval, start) {
  const out = new Map();
  let cur = start, err = null;
  while (cur <= Date.now()) {
    let data = null;
    for (const h of HOSTS) {
      try { const r = await fetch(`${h}/api/v3/klines?symbol=${sym}&interval=${interval}&startTime=${cur}&limit=1000`); if (!r.ok) throw new Error(r.status); data = await r.json(); break; } catch (e) { err = e; }
    }
    if (!data) throw err;
    if (!data.length) break;
    for (const k of data) out.set(Math.floor(k[0] / 1000), { o: +k[1], h: +k[2], l: +k[3], c: +k[4], qv: +k[7] });
    cur = data[data.length - 1][0] + IVS[interval];
    if (data.length < 1000) break;
  }
  return out;
}
// 已結算的資金費率歷史（結算間隔會變：8 小時、1 小時、4 小時），失敗時回傳空陣列不影響主圖
async function getFunding() {
  const F = "https://fapi.binance.com", out = [];
  try {
    let cur = START;
    while (true) {
      const r = await fetch(`${F}/fapi/v1/fundingRate?symbol=STGUSDT&startTime=${cur}&limit=1000`);
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      if (!d.length) break;
      for (const x of d) { const v = +x.fundingRate * 100; out.push({ time: Math.floor(x.fundingTime / 1000) + SHIFT, value: v, color: v >= 0 ? "rgba(38,166,154,.8)" : "rgba(239,83,80,.9)" }); }
      cur = d[d.length - 1].fundingTime + 1;
      if (d.length < 1000) break;
    }
  } catch (e) { console.warn("[warn] 資金費率歷史失敗", e); }
  const seen = new Set();
  return out.filter((x) => (seen.has(x.time) ? false : seen.add(x.time))).sort((a, b) => a.time - b.time);
}
async function refreshFunding() {                          // 即時預估費率，與幣安前端 Funding / Countdown 同一個值
  try {
    const r = await fetch("https://fapi.binance.com/fapi/v1/premiumIndex?symbol=STGUSDT"), p = await r.json();
    const v = +p.lastFundingRate * 100, ms = p.nextFundingTime - Date.now();
    $("cFr").textContent = (v >= 0 ? "+" : "") + v.toFixed(4) + "%"; $("cFr").className = "v " + (v >= 0 ? "up" : "down");
    $("cFrS").textContent = ms > 0 ? `${Math.floor(ms / 3600000)} 小時 ${Math.floor((ms % 3600000) / 60000)} 分後結算` : "結算中";
  } catch (e) { console.warn("[warn] 即時資金費率失敗", e); }
}
function mkBar(t, s, z) {
  const fair = R * z.c;
  const o = (s.o / (R * z.o) - 1) * 100, c = (s.c / fair - 1) * 100;
  return { time: t + SHIFT, open: o, high: Math.max(o, c, (s.h / fair - 1) * 100), low: Math.min(o, c, (s.l / fair - 1) * 100), close: c, stg: s.c, zro: z.c, fair, qv: s.qv };
}
const setAll = (bars) => {
  premS.setData(bars.map((b) => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close })));
  stgS.setData(bars.map((b) => ({ time: b.time, value: b.stg })));
  fairS.setData(bars.map((b) => ({ time: b.time, value: b.fair })));
  volS.setData(bars.map((b) => ({ time: b.time, value: b.qv, color: b.close >= b.open ? "rgba(38,166,154,.5)" : "rgba(239,83,80,.5)" })));
};
function setMarkers(bars) {
  if (!markers) return;
  const ms = [];
  for (const [d, txt] of EVENTS) {
    const ev = Math.floor(new Date(d + "T00:00:00+08:00").getTime() / 1000) + SHIFT;
    const b = bars.find((x) => x.time <= ev && ev < x.time + IVS[iv] / 1000);
    if (b) ms.push({ time: b.time, position: "aboveBar", color: "#f0b90b", shape: "arrowDown", text: txt });
  }
  markers.setMarkers(ms.sort((a, b) => a.time - b.time));
}

let bars = [];
async function load() {
  const my = ++dbg.loads;
  $("dot").className = "dot"; $("fLoad").textContent = "載入中";
  let s, z, fr;
  try { [s, z, fr] = await Promise.all([getK("STGUSDT", iv, START), getK("ZROUSDT", iv, START), getFunding()]); }
  catch (e) { console.error(e); $("dot").className = "dot bad"; $("fLoad").textContent = "載入失敗：" + e; return; }
  if (my !== dbg.loads) return;
  bars = [...s.keys()].filter((t) => z.has(t)).sort((a, b) => a - b).map((t) => mkBar(t, s.get(t), z.get(t)));
  dbg.bars = bars; dbg.iv = iv;
  setAll(bars); fundS.setData(fr); dbg.funding = fr; setMarkers(bars); applyRange(); refreshCards(); refreshFunding();
  $("dot").className = "dot ok"; $("fLoad").textContent = `${iv} 線，${bars.length} 根，最後更新 ${new Date().toLocaleTimeString("zh-TW", { timeZone: "Asia/Taipei", hour12: false })}`;
  console.log(`[load] ${iv} ${bars.length} 根`);
}
async function refreshTail() {
  if (!bars.length) return;
  try {
    const from = Date.now() - IVS[iv] * 3;
    const [s, z] = await Promise.all([getK("STGUSDT", iv, from), getK("ZROUSDT", iv, from)]);
    for (const t of [...s.keys()].sort((a, b) => a - b)) {
      if (!z.has(t)) continue;
      const b = mkBar(t, s.get(t), z.get(t)), i = bars.findIndex((x) => x.time === b.time);
      if (i >= 0) bars[i] = b; else if (b.time > bars[bars.length - 1].time) bars.push(b); else continue;
      premS.update({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close });
      stgS.update({ time: b.time, value: b.stg }); fairS.update({ time: b.time, value: b.fair });
      volS.update({ time: b.time, value: b.qv, color: b.close >= b.open ? "rgba(38,166,154,.5)" : "rgba(239,83,80,.5)" });
    }
    refreshCards(); refreshFunding();
  } catch (e) { console.warn("[warn] 尾端更新失敗", e); }
}

// ---------- 範圍、數字卡、圖例 ----------
function visibleBars() {
  const days = (RANGES.find((r) => r[0] === rng) || [0, 0])[1];
  if (!days || !bars.length) return bars;
  const t0 = bars[bars.length - 1].time - days * 86400;
  return bars.filter((b) => b.time >= t0);
}
function applyRange() {
  const vb = visibleBars();
  if (!vb.length) return;
  try { if (rng === "全部") chart.timeScale().fitContent(); else chart.timeScale().setVisibleRange({ from: vb[0].time, to: vb[vb.length - 1].time + IVS[iv] / 1000 * 2 }); } catch (e) {}
}
const f1 = (v) => (v >= 0 ? "+" : "") + v.toFixed(1) + "%";
const fd = (t) => new Date((t - SHIFT) * 1000).toLocaleDateString("zh-TW", { timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit" });
function refreshCards() {
  if (!bars.length) return;
  const b = bars[bars.length - 1], vb = visibleBars();
  $("cNow").textContent = f1(b.close); $("cNow").className = "v " + (b.close >= 0 ? "up" : "down");
  $("cNowS").textContent = fd(b.time) + " 收盤";
  const mx = vb.reduce((a, x) => (x.high > a.high ? x : a), vb[0]);
  $("cMax").textContent = f1(mx.high); $("cMaxS").textContent = fd(mx.time) + "，範圍 " + rng;
  const cs = vb.map((x) => x.close).sort((p, q) => p - q), med = cs[Math.floor(cs.length / 2)];
  $("cMed").textContent = f1(med); $("cMedS").textContent = vb.length + " 根";
  $("cPx").textContent = b.stg.toFixed(4) + " / " + b.fair.toFixed(4); $("cPxS").textContent = "ZRO " + b.zro.toFixed(4);
}
chart.subscribeCrosshairMove((p) => {
  const d = p.seriesData && p.seriesData.get(premS);
  if (!d) { $("legend").innerHTML = ""; return; }
  const b = bars.find((x) => x.time === p.time);
  const cls = d.close >= d.open ? "up" : "down";
  $("legend").innerHTML = `溢價 <span class="${cls}">開 ${f1(d.open)}　高 ${f1(d.high)}　低 ${f1(d.low)}　收 ${f1(d.close)}</span>` +
    (b ? `<br>STG ${b.stg.toFixed(5)}　ZRO ${b.zro.toFixed(4)}　合理價 ${b.fair.toFixed(5)}　成交額 ${(b.qv / 1e6).toFixed(2)}M` : "") +
    (() => { let f = null; for (const x of dbg.funding || []) { if (x.time <= p.time) f = x; else break; } return f ? `<br>最近一筆已結算資金費率 ${f.value.toFixed(4)}%` : ""; })();
});

// ---------- 控制列 ----------
function buildBar() {
  $("ivs").innerHTML = ""; $("rngs").innerHTML = "";
  for (const k of Object.keys(IVS)) { const b = document.createElement("button"); b.textContent = k; b.className = k === iv ? "on" : ""; b.onclick = () => switchInterval(k); $("ivs").appendChild(b); }
  for (const [k] of RANGES) { const b = document.createElement("button"); b.textContent = k; b.className = k === rng ? "on" : ""; b.onclick = () => { rng = k; store("lt_rng", k); buildBar(); applyRange(); refreshCards(); }; $("rngs").appendChild(b); }
}
function switchInterval(k) { iv = k; store("lt_iv", k); buildBar(); load(); }
$("logBtn").onclick = () => { logOn = !logOn; store("lt_log", logOn ? "1" : "0"); applyLog(); };

buildBar(); applyLog(); load();
setInterval(refreshTail, 15000);
</script>
</body>
</html>
